[package]
name = "vork-slang"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1"
blake3 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
naga = { version = "29", features = ["wgsl-in", "hlsl-out"] }
libloading = "0.8"
vork-scene = { path = "../vork-scene" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies.vork-scene]
path = "../vork-scene"
features = ["test-support"]

[build-dependencies]
cc = "1"
