[package]
name = "vork-render"
version.workspace = true
edition.workspace = true
license.workspace = true
[dependencies]
vork-time = { path = "../vork-time" }
vork-std = { path = "../vork-std" }
vork-mesh = { path = "../vork-mesh" }
vork-scene = { path = "../vork-scene" }
vork-slang = { path = "../vork-slang" }
anyhow = "1"
wgpu = { version = "29", features = ["noop"] }
glam = { version = "0.30", features = ["bytemuck"] }
bytemuck = { version = "1", features = ["derive"] }
gltf = { version = "1.4", features = ["extras", "KHR_lights_punctual", "KHR_texture_transform", "extensions", "KHR_materials_transmission", "KHR_materials_volume", "KHR_materials_ior", "KHR_materials_emissive_strength"] }
blake3 = "1"
# Avoid zero-filling worst-case compression output; retain checked, safe cache reads.
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-decode", "checked-decode"] }
memmap2 = "0.9"
pollster = "0.4"
serde_json = "1"
png = "0.18"
exr = { version = "1.74", default-features = false }
libc = "0.2"
libloading = "0.8"
vork-encode = { path = "../vork-encode" }
serde = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "hdr", "exr", "tiff"] }
half = "2"
basisu_c_sys = { version = "0.9.1", features = ["encoder", "extra"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
proptest = { version = "1", default-features = false, features = ["std"] }

[target.'cfg(target_arch = "x86_64")'.dependencies]
intel_tex_2 = "0.5.0"

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
ash = "0.38"

[target.'cfg(target_os = "macos")'.dependencies]
objc2-metal = "0.3"

[build-dependencies]
blake3 = "1"
serde_json = "1"

[dev-dependencies.vork-scene]
path = "../vork-scene"
features = ["test-support"]

[features]
test-support = ["vork-scene/test-support"]

[[example]]
name = "profile_conformance"
required-features = ["test-support"]

[[example]]
name = "render_test"
required-features = ["test-support"]

[dev-dependencies.vork-render]
path = "."
features = ["test-support"]
