[package]
name = "vork-scene"
version.workspace = true
edition.workspace = true
license.workspace = true
# Exposes the generated OpenPBR Closure to the renderer build (no native library).
links = "vork_openpbr"
[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = { version = "0.30", features = ["serde"] }
schemars = "1"

[features]
test-support = []
