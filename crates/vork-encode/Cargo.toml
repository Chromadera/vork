[package]
name = "vork-encode"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
vork-time = { path = "../vork-time" }
wgpu = "29.0.3"
anyhow = "1"

[target.'cfg(target_os = "linux")'.dependencies]
ash = "0.38"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-metal = "0.3"

[build-dependencies]
cc = "1"

[dev-dependencies]
pollster = "0.4"
