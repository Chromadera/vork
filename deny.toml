# Project licence selection is deliberately independent of dependency licences.
[advisories]
ignore = [
    # paste 1.0.15 is used only as a compile-time identifier-generating proc macro
    # by pulp 0.22.3, for the vendored exr 1.74.2 DWA SIMD decoder. It does not
    # parse EXR input at runtime. The current pulp release still uses paste;
    # pastey is not an upstream dependency upgrade: adopting it here requires
    # maintaining a pulp fork/patch or replacing the decoder stack (including
    # our EXR allocation bounds patch). Keep the existing code rather than add
    # that maintenance for an unmaintained-only advisory with no reported flaw.
    # Revisit when pulp removes paste or an EXR upgrade removes this dependency.
    { id = "RUSTSEC-2024-0436", reason = "Compile-time paste through pulp/exr; no upstream upgrade removes it without a local fork" },

]

[licenses]
confidence-threshold = 0.8
allow = ["MIT", "MIT-0", "Apache-2.0", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Zlib", "0BSD", "CC0-1.0", "Unicode-3.0", "Unlicense", "LicenseRef-vork-Preview"]

# Mozilla CA root data used by rustls: redistribution requires carrying the
# permissive data licence; scripts/generate-notice includes its full text.
[[licenses.exceptions]]
name = "webpki-roots"
allow = ["CDLA-Permissive-2.0"]
