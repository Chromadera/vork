[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vork"
version = "0.5.0"
requires-python = ">=3.11"
description = "Generated scene types and shared standard library for vork"
license = "LicenseRef-vork-Preview"

[tool.setuptools]
packages = ["vork"]

[tool.setuptools.package-data]
vork = ["py.typed", "_resource_slots.json"]
