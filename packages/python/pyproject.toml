[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "vork"
version = "0.5.1"
requires-python = ">=3.11"
description = "Scene types and Python SDK for the vork renderer"
readme = "README.md"
license-files = ["LICENSE"]
license = "LicenseRef-vork-Preview"

[tool.setuptools]
packages = ["vork"]

[tool.setuptools.package-data]
vork = ["py.typed", "_resource_slots.json"]
